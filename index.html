<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exclude Overlap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gui-bg: #f1f1f1;
      --gui-input-bg: rgb(255, 255, 255);
      --gui-input-bg-hover: #f0f0f0;
      --gui-input-bg-focus: #e0e0e0;
      --gui-input-bg-active: #d0d0d0;
      --gui-input-fg: #242424;
      --gui-title-fg: #242424;
      --gui-title-bg: rgb(255, 255, 255);
      --gui-title-bg-hover: #b6b6b6;
      --gui-title-bg-focus: #b6b6b6;
      --gui-title-bg-active: #b6b6b6;
      --gui-label-fg: #242424;
      --gui-button-fg: #242424;
      --gui-button-bg: #dbdbdb;
      --gui-button-bg-hover: #b6b6b6;
      --gui-button-bg-focus: #b6b6b6;
      --gui-button-bg-active: #d5d5d5;
    }

    html, body { margin: 0; padding: 0; background: #f1f1f1; height: 100%; overflow: hidden; }
    body { display: grid; grid-template-columns: 280px 1fr; }

    #pane-holder {
      --tp-base-font-family: 'IBM Plex Mono', 'Hiragino Sans', 'Yu Gothic', monospace;
      height: 100vh;
      overflow-y: auto;
      background: var(--gui-bg);
      --tp-base-background-color: var(--gui-bg);
      --tp-input-background-color: var(--gui-input-bg);
      --tp-input-background-color-hover: var(--gui-input-bg-hover);
      --tp-input-background-color-focus: var(--gui-input-bg-focus);
      --tp-input-background-color-active: var(--gui-input-bg-active);
      --tp-input-foreground-color: var(--gui-input-fg);
      --tp-container-foreground-color: var(--gui-title-fg);
      --tp-container-background-color: var(--gui-title-bg);
      --tp-container-background-color-hover: var(--gui-title-bg-hover);
      --tp-container-background-color-focus: var(--gui-title-bg-focus);
      --tp-container-background-color-active: var(--gui-title-bg-active);
      --tp-label-foreground-color: var(--gui-label-fg);
      --tp-button-foreground-color: var(--gui-button-fg);
      --tp-button-background-color: var(--gui-button-bg);
      --tp-button-background-color-hover: var(--gui-button-bg-hover);
      --tp-button-background-color-focus: var(--gui-button-bg-focus);
      --tp-button-background-color-active: var(--gui-button-bg-active);
      --tp-base-border-radius: 0;
    }
    #pane-holder *, #pane-holder *::before, #pane-holder *::after { border-radius: 0 !important; }
    #pane-holder .tp-rotv { box-shadow: none; }
    #pane-holder .tp-rotv_b { height: 40px; pointer-events: none; }
    #pane-holder .tp-rotv_m { display: none; }
    #pane-holder .tp-fldv_b { pointer-events: none; }
    #pane-holder .tp-fldv_m { display: none; }
    #pane-holder .tp-rotv_t { font-size: 13px; line-height: 40px; }
    #pane-holder .tp-btnv_b { height: 28px; }
    #pane-holder .tp-ckbv_l { display: flex; justify-content: flex-end; }

    #sketch-holder { min-width: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--gui-bg); }
    canvas { display: block; }
  </style>
</head>

<body>
  <div id="pane-holder"></div>
  <div id="sketch-holder"></div>

  <!-- p5.js 本体（先に読み込む） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <!-- p5.capture（連番画像キャプチャ） -->
  <script src="https://cdn.jsdelivr.net/npm/p5.capture@1.6.0/dist/p5.capture.umd.min.js"></script>

  <!-- パラメータ（sketch.js が参照する） -->
  <script>
    const DEFAULT_PARAMS = {
      circleSize: 20,          // タイルのサイズ
      pixAngle: 0,            // タイルの角度（度）
      pixAspect: 1,           // タイルの縦横比（幅/高さ）
      fontName: 'serif',                // フォント（システムフォント名。serif は OS 標準の明朝/セリフ）
      text: 'a',               // 表示する文字
      fontSize: 700,           // 文字サイズ（px）
      showSvg: false,          // 読み込んだ SVG のタイルを表示するか（Show Text とは独立）
      svgScale: 100,           // SVG の大きさ（%、100 でキャンバスに収まる大きさ）
      showText: false,         // 文字のタイルを表示するか（初期は非表示）
      mode: 'outline',         // 'outline'（輪郭）| 'fill'（塗りつぶしグリッド）
      pixPerCell: 1,         // Fill: 1セルに横並びで置くタイルの数
      svgMode: 'outline',      // SVG 用（Text とは別々の設定）
      svgGridStep: 12,
      svgPixPerCell: 1,
      svgCount: 5,
      trailGridStep: 12,       // ブラシ（Trail の Fill）用のセルサイズ
      trailPixPerCell: 1,    // ブラシ用の横並びタイル数
      gridStep: 12,            // 塗りつぶしモードのセルサイズ（px）
      trailMode: 'trail',      // 'trail'（軌跡）| 'fill'（ブラシで塗りつぶし）
      brushSize: 60,           // ブラシの直径（px）
      trailSpacing: 10,        // 軌跡のタイル間隔（px）
      pixRound: 0,            // 角丸の強さ（%、100で完全な丸）
      count: 5,                // 円の数（sampleFactor × 100）
      seed: 0,                 // シード
      jitter: 10,              // ばらけ
      thinOut: 30              // 間引く割合（%）
    };
    const LS_KEY = 'pix_params';
    const params = Object.assign({}, DEFAULT_PARAMS);
    try {
      Object.assign(params, JSON.parse(localStorage.getItem(LS_KEY) || '{}'));
    } catch (e) { /* 壊れた保存値は無視 */ }
  </script>

  <script type="module">
    import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4.0.4/dist/tweakpane.min.js';

    const pane = new Pane({
      container: document.getElementById('pane-holder'),
      title: 'Exclude Overlap'
    });

    // OS に入っているフォントを候補から検出する（canvas の文字幅が代替フォントと違えば入っているとみなす）
    const CANDIDATE_FONTS = [
      'serif', 'sans-serif', 'monospace', 'cursive', 'fantasy',
      // 欧文
      'Arial', 'Arial Black', 'Arial Narrow', 'Arial Rounded MT Bold', 'American Typewriter', 'Andale Mono',
      'Avenir', 'Avenir Next', 'Baskerville', 'Big Caslon', 'Bodoni 72', 'Book Antiqua', 'Bookman Old Style',
      'Bradley Hand', 'Brush Script MT', 'Calibri', 'Cambria', 'Candara', 'Century Gothic', 'Chalkboard',
      'Charter', 'Cochin', 'Comic Sans MS', 'Consolas', 'Constantia', 'Cooper Black', 'Copperplate', 'Corbel',
      'Courier', 'Courier New', 'Didot', 'Futura', 'Franklin Gothic Medium', 'Garamond', 'Geneva', 'Georgia',
      'Gill Sans', 'Helvetica', 'Helvetica Neue', 'Herculanum', 'Hoefler Text', 'Impact', 'Ink Free',
      'Lucida Console', 'Lucida Grande', 'Lucida Sans Unicode', 'Luminari', 'Marker Felt', 'Menlo', 'Mistral',
      'Monaco', 'Noteworthy', 'Optima', 'Palatino', 'Palatino Linotype', 'Papyrus', 'Perpetua', 'Phosphate',
      'Rockwell', 'Segoe UI', 'Skia', 'Snell Roundhand', 'Tahoma', 'Times', 'Times New Roman', 'Trebuchet MS',
      'Verdana', 'Zapfino',
      // 日本語
      'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Hiragino Kaku Gothic Pro', 'Hiragino Mincho ProN',
      'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Yu Mincho', 'YuKyokasho', 'Meiryo', 'MS Gothic', 'MS PGothic',
      'MS Mincho', 'MS PMincho', 'Osaka', 'Toppan Bunkyu Mincho', 'Klee',
      // 中国語・韓国語
      'PingFang SC', 'PingFang TC', 'Heiti SC', 'Songti SC', 'Microsoft YaHei', 'SimSun', 'SimHei',
      'Apple SD Gothic Neo', 'Malgun Gothic', 'Batang', 'Gulim'
    ];
    const isFontAvailable = (() => {
      const ctx = document.createElement('canvas').getContext('2d');
      const bases = ['monospace', 'serif', 'sans-serif'];
      const sample = 'mmmmmmmmmmlli あ 永 Wg';
      const width = (font) => { ctx.font = `72px ${font}`; return ctx.measureText(sample).width; };
      const baseWidths = bases.map(width);
      return (name) => bases.some((b, i) => width(`"${name}", ${b}`) !== baseWidths[i]);
    })();
    const availableFonts = CANDIDATE_FONTS.filter(n => ['serif', 'sans-serif', 'monospace', 'cursive', 'fantasy'].includes(n) || isFontAvailable(n));
    const fontOptions = Object.fromEntries(availableFonts.map(n => [n, n]));
    // 読み込んだ SVG は保存されないので、起動時は文字に戻す
    params.showSvg = false;
    // 保存済みのフォントがこの PC にない場合は既定に戻す
    if (!(params.fontName in fontOptions)) params.fontName = DEFAULT_PARAMS.fontName;

    const save = () => {
      try { localStorage.setItem(LS_KEY, JSON.stringify(params)); } catch (e) { }
    };

    const trail = pane.addFolder({ title: 'Brush' });
    trail.addBinding(params, 'trailMode', { label: 'Mode', options: { Trail: 'trail', Fill: 'fill' } });
    const trailOnly = [trail.addBinding(params, 'trailSpacing', { label: 'Spacing', min: 1, max: 100, step: 1 })];
    const fillOnly = [
      trail.addBinding(params, 'brushSize', { label: 'Brush Size', min: 4, max: 300, step: 1 }),
      trail.addBinding(params, 'trailGridStep', { label: 'Cell Size', min: 2, max: 30, step: 1 }),
      trail.addBinding(params, 'trailPixPerCell', { label: 'Pix Count', min: 1, max: 10, step: 1 })
    ];
    // Mode に応じて、効く項目だけを表示する（Trail: Spacing / Fill: Brush Size・Cell Size・Pix Count）
    const updateBrushVisibility = () => {
      const fill = params.trailMode === 'fill';
      trailOnly.forEach(b => { b.hidden = fill; });
      fillOnly.forEach(b => { b.hidden = !fill; });
    };
    updateBrushVisibility();

    // Text / SVG それぞれに持つ配置の設定（キー名の接頭辞だけ違い、値は別々）
    // Mode に応じて効く項目だけを表示する（Outline: Count / Fill: Cell Size・Pix Count）
    const shapeVisibilityUpdaters = [];
    const addShapeSettings = (folder, k) => {
      folder.addBinding(params, k.mode, { label: 'Mode', options: { Outline: 'outline', Fill: 'fill' } });
      const fillOnly = [
        folder.addBinding(params, k.gridStep, { label: 'Cell Size', min: 2, max: 30, step: 1 }),
        folder.addBinding(params, k.pix, { label: 'Pix Count', min: 1, max: 10, step: 1 })
      ];
      const outlineOnly = [folder.addBinding(params, k.count, { label: 'Count', min: 1, max: 30, step: 1 })];
      const update = () => {
        const fill = params[k.mode] === 'fill';
        fillOnly.forEach(bd => { bd.hidden = !fill; });
        outlineOnly.forEach(bd => { bd.hidden = fill; });
      };
      update();
      shapeVisibilityUpdaters.push(update);
    };

    const textFolder = pane.addFolder({ title: 'Text' });
    textFolder.addBinding(params, 'showText', { label: 'Show Text' });
    textFolder.addBinding(params, 'text', { label: 'Text' });
    textFolder.addBinding(params, 'fontSize', { label: 'Font Size', min: 50, max: 1500, step: 10 });
    textFolder.addBinding(params, 'fontName', { label: 'Font', options: fontOptions });
    addShapeSettings(textFolder, { mode: 'mode', gridStep: 'gridStep', pix: 'pixPerCell', count: 'count' });

    const svgFolder = pane.addFolder({ title: 'SVG' });
    svgFolder.addBinding(params, 'showSvg', { label: 'Show SVG' });
    svgFolder.addBinding(params, 'svgScale', { label: 'SVG Scale', min: 10, max: 300, step: 1 });
    addShapeSettings(svgFolder, { mode: 'svgMode', gridStep: 'svgGridStep', pix: 'svgPixPerCell', count: 'svgCount' });

    const pix = pane.addFolder({ title: 'Pix Shape' });
    pix.addBinding(params, 'circleSize', { label: 'Size', min: 2, max: 200, step: 1 });
    pix.addBinding(params, 'pixAngle', { label: 'Angle', min: -180, max: 180, step: 1 });
    pix.addBinding(params, 'pixAspect', { label: 'Aspect', min: 1, max: 5, step: 0.05 });
    pix.addBinding(params, 'pixRound', { label: 'Round', min: 0, max: 100, step: 1 });

    const dist = pane.addFolder({ title: 'Pix Arrangement' });
    dist.addBinding(params, 'seed', { label: 'Seed', min: 0, max: 999, step: 1 });
    dist.addBinding(params, 'jitter', { label: 'Jitter', min: 0, max: 60, step: 1 });
    dist.addBinding(params, 'thinOut', { label: 'Reduce', min: 0, max: 100, step: 1 });

    pane.addButton({ title: 'Reset Params' }).on('click', () => {
      Object.assign(params, DEFAULT_PARAMS);
      pane.refresh();
      updateBrushVisibility();
      shapeVisibilityUpdaters.forEach(f => f());
      save();
    });

    // SVG を読み込んで、その形に沿ってタイルを配置する
    const svgInput = document.createElement('input');
    svgInput.type = 'file';
    svgInput.accept = '.svg,image/svg+xml';
    svgInput.addEventListener('change', async () => {
      const file = svgInput.files[0];
      svgInput.value = ''; // 同じファイルを続けて選べるように
      if (!file) return;
      try {
        await loadSVG(await file.text());
        params.showSvg = true; // 読み込んだらすぐ表示（Show Text には触らない）
        pane.refresh();
        save();
      } catch (e) {
        alert(e.message);
      }
    });
    svgFolder.addButton({ title: 'Import SVG' }).on('click', () => svgInput.click());

    pane.addButton({ title: 'Undo' }).on('click', () => undo());

    pane.addButton({ title: 'Clear Canvas' }).on('click', () => clearCanvas());

    pane.addButton({ title: 'Export SVG' }).on('click', () => exportSVG());

    pane.on('change', () => { save(); updateBrushVisibility(); shapeVisibilityUpdaters.forEach(f => f()); });

    // Undo: Cmd/Ctrl+Z
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() !== 'z' || !(e.metaKey || e.ctrlKey) || e.shiftKey) return;
      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
      undo();
      e.preventDefault();
    });

    // Illustrator と同じブラシサイズのショートカット（[ で小さく、] で大きく。長押しで連続）
    window.addEventListener('keydown', (e) => {
      if (e.key !== '[' && e.key !== ']') return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
      const step = Math.max(1, Math.round(params.brushSize * 0.1));
      params.brushSize = Math.min(300, Math.max(4, params.brushSize + (e.key === ']' ? step : -step)));
      pane.refresh();
      save();
      e.preventDefault();
    });
  </script>

  <!-- 輪郭抽出（システムフォントのラスターから等値線を取る） -->
  <script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-contour@4.0.2/dist/d3-contour.min.js"></script>

  <script src="sketch.js"></script>
</body>

</html>
